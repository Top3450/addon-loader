plugins { id 'com.android.application' }
android {
    namespace 'th.top.addonloader'
    compileSdk 34
    defaultConfig {
        applicationId 'th.top.addonloader'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }
    // fixed key so every new build installs over the old one
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/addonloader.jks')
            storePassword 'addonloader'
            keyAlias 'addonloader'
            keyPassword 'addonloader'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
